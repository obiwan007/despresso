name: PlayStore

on:
  workflow_dispatch:
  workflow_call:

jobs:
  buildall:
    runs-on: ubuntu-latest # faster for Android builds

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ✅ Cache Gradle (BIGGEST SPEEDUP)
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ✅ Cache Dart/Flutter dependencies
      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Decode secrets.properties file
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          PLAYSTORE_PRIVATE_SERVICE_ACCOUNT_KEY: ${{ secrets.PLAYSTORE_PRIVATE_SERVICE_ACCOUNT_KEY }}
        run: |
          mkdir -p keys
          echo "$KEYSTORE" | base64 -d > android/upload-keystore.jks
          echo "$KEYSTORE" | base64 -d > keys/upload-keystore.jks
          echo "$PLAYSTORE_PRIVATE_SERVICE_ACCOUNT_KEY" > keys/playstore-key.json
          chmod +x android/gradlew

      - name: Restore key.properties
        env:
          KEYPROPERTIES: ${{ secrets.KEYPROPERTIES }}
        run: echo "$KEYPROPERTIES" > android/key.properties

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Install Ruby (for Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          bundler-cache: true

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Replace secrets in code
        env:
          SENTRY_KEY: ${{ secrets.SENTRY_KEY }}
          VIS_CLIENT: ${{ secrets.VIS_CLIENT }}
          VIS_SECRET: ${{ secrets.VIS_SECRET }}
        run: |
          ESCAPED_KEY=$(printf '%s\n' "$SENTRY_KEY" | sed -e 's/[\/&]/\\&/g')
          sed -i "s/<SENTRY_KEY>/$ESCAPED_KEY/g" ./lib/main.dart
          sed -i "s/<VIS_SECRET>/$VIS_SECRET/g" ./lib/model/services/state/visualizer_service.dart
          sed -i "s/<VIS_CLIENT>/$VIS_CLIENT/g" ./lib/model/services/state/visualizer_service.dart

      # ✅ Pre-fetch dependencies (helps cache effectiveness)
      - name: Get dependencies
        run: flutter pub get

      # ✅ Build (optimized flags)
      - name: Build App Bundle
        run: |
          flutter build appbundle --release --split-debug-info=build/debug-info

      - name: Bundle install (Fastlane)
        run: |
          cd android
          bundle install

      - name: Upload to Play Store
        uses: maierj/fastlane-action@v3.1.0
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_KEY_ID: ${{ secrets.API_KEY_ID }}
          ISSUER_ID: ${{ secrets.ISSUER_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        with:
          lane: beta
          subdirectory: android
